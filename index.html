<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KERBECK</title>

    <!-- Google Fonts: Saira Condensed (display) + Inter (text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Saira+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink:  '#070A0B',
                        panel:'#091012',
                        bone: '#EDEAE4',
                        red:  '#E10600'
                    },
                    fontFamily: {
                        display: ['"Saira Condensed"', 'sans-serif'],
                        sans:    ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="hero">

        <!-- ============ BACKGROUND VIDEO ============ -->
        <video class="hero__video" autoplay muted loop playsinline poster="images/hero-poster.jpg">
            <source src="images/hero.mp4" type="video/mp4">
        </video>
        <div class="hero__scrim" aria-hidden="true"></div>

        <!-- ============ NAV ============ -->
        <header class="nav">
            <button type="button" class="nav__menu" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
                <span class="burger" aria-hidden="true"><span></span><span></span><span></span></span>
                <span class="nav__menu-label">Menu</span>
            </button>

            <a class="nav__logo" href="/" aria-label="KERBECK — home">
                <img src="images/logo-kerbeck.svg" alt="KERBECK">
            </a>

            <a class="cta nav__contact" href="#contact"><span>Contact</span></a>
        </header>

        <!-- ============ BOTTOM DOCK — collapsible hover sections ============ -->
        <section class="dock" aria-label="Our brands">

            <!-- Premium brands -->
            <div class="sect" data-sect="premium">
                <span class="sect__label">Our Premium Brands</span>
                <div class="sect__content">
                    <ul class="brands">
                        <li>
                            <a href="https://www.fckerbecklamborghini.com/" target="_blank" rel="noopener" aria-label="Lamborghini">
                                <img src="images/lambo_logo.svg" alt="Lamborghini">
                            </a>
                        </li>
                        <li>
                            <a href="https://www.fckerbeckrollsroyce.com/" target="_blank" rel="noopener" aria-label="Rolls-Royce">
                                <img src="images/rr_logo.svg" alt="Rolls-Royce">
                            </a>
                        </li>
                        <li>
                            <a href="https://www.astonmartinphiladelphia.com/" target="_blank" rel="noopener" aria-label="Aston Martin">
                                <img src="images/aston_logo.svg" alt="Aston Martin">
                            </a>
                        </li>
                        <li>
                            <a href="https://www.fckerbeckmaserati.com/" target="_blank" rel="noopener" aria-label="Maserati">
                                <img src="images/maserati_logo.svg" alt="Maserati">
                            </a>
                        </li>
                        <li>
                            <a href="https://www.bentleypalmyra.com/" target="_blank" rel="noopener" aria-label="Bentley">
                                <img src="images/bentley_logo.svg" alt="Bentley">
                            </a>
                        </li>
                    </ul>
                    <a class="cta sect__all" href="https://www.kerbeckcars.com/" target="_blank" rel="noopener"><span>View All</span></a>
                </div>
            </div>

            <!-- Buick GMC -->
            <div class="sect" data-sect="gmc">
                <span class="sect__label">Buick GMC</span>
                <div class="sect__content">
                    <ul class="brands">
                        <li>
                            <a href="https://www.fckerbeckbuickgmc.com/" target="_blank" rel="noopener" aria-label="Buick">
                                <img src="images/buick_logo.svg" alt="Buick">
                            </a>
                        </li>
                        <li>
                            <a href="https://www.fckerbeckbuickgmc.com/" target="_blank" rel="noopener" aria-label="GMC">
                                <img src="images/gmc_logo.svg" alt="GMC">
                            </a>
                        </li>
                        <li>
                            <a href="https://www.fckerbeckbuickgmc.com/" target="_blank" rel="noopener" aria-label="Hummer">
                                <img src="images/hummer_logo.svg" alt="Hummer">
                            </a>
                        </li>
                    </ul>
                    <a class="cta sect__all" href="https://www.fckerbeckbuickgmc.com/" target="_blank" rel="noopener"><span>View All</span></a>
                </div>
            </div>

            <!-- Preowned Cadillac -->
            <div class="sect" data-sect="cadillac">
                <span class="sect__label">Preowned Cadillac</span>
                <div class="sect__content">
                    <ul class="brands">
                        <li>
                            <a href="https://www.fckerbeckcadillacs.com/" target="_blank" rel="noopener" aria-label="Cadillac">
                                <img src="images/cadillac_logo.svg" alt="Cadillac">
                            </a>
                        </li>
                    </ul>
                    <a class="cta sect__all" href="https://www.fckerbeckcadillacs.com/" target="_blank" rel="noopener"><span>View All</span></a>
                </div>
            </div>

        </section>

    </main>

    <!-- ============ FULLSCREEN MENU OVERLAY ============ -->
    <div class="menu" id="menu" role="dialog" aria-modal="true" aria-label="Main menu" aria-hidden="true">
        <div class="menu__panel">
            <!-- Background image (changes on hover) -->
            <div class="menu__bg" id="menu-bg-1"></div>
            <div class="menu__bg" id="menu-bg-2"></div>

            <nav class="menu__nav" aria-label="Primary">
                <ul class="menu__list">
                    <li class="menu__item"><a class="menu__link" href="#" data-img="images/menu/home.jpg"><span class="menu__text"><span class="menu__text-a">Home</span><span class="menu__text-b" aria-hidden="true">Home</span></span></a></li>
                    <li class="menu__item"><a class="menu__link" href="#" data-img="images/menu/new-inventory.jpg"><span class="menu__text"><span class="menu__text-a">New Inventory</span><span class="menu__text-b" aria-hidden="true">New Inventory</span></span></a></li>
                    <li class="menu__item"><a class="menu__link" href="#" data-img="images/menu/pre-owned.jpg"><span class="menu__text"><span class="menu__text-a">Pre-Owned</span><span class="menu__text-b" aria-hidden="true">Pre-Owned</span></span></a></li>
                    <li class="menu__item"><a class="menu__link" href="#" data-img="images/menu/finance.jpg"><span class="menu__text"><span class="menu__text-a">Finance</span><span class="menu__text-b" aria-hidden="true">Finance</span></span></a></li>
                    <li class="menu__item"><a class="menu__link" href="#" data-img="images/menu/get-prequalified.jpg"><span class="menu__text"><span class="menu__text-a">Get Pre-qualified</span><span class="menu__text-b" aria-hidden="true">Get Pre-qualified</span></span></a></li>
                    <li class="menu__item"><a class="menu__link" href="#" data-img="images/menu/service-parts.jpg"><span class="menu__text"><span class="menu__text-a">Service &amp; Parts</span><span class="menu__text-b" aria-hidden="true">Service &amp; Parts</span></span></a></li>
                    <li class="menu__item"><a class="menu__link" href="#" data-img="images/menu/about.jpg"><span class="menu__text"><span class="menu__text-a">About</span><span class="menu__text-b" aria-hidden="true">About</span></span></a></li>
                    <li class="menu__item"><a class="menu__link" href="#contact" data-img="images/menu/contact.jpg"><span class="menu__text"><span class="menu__text-a">Contact</span><span class="menu__text-b" aria-hidden="true">Contact</span></span></a></li>
                </ul>
            </nav>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
