<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KERBECK</title>

    <!-- Google Fonts: Saira Condensed (display) + Inter (text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Saira+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink:  '#070A0B',
                        panel:'#091012',
                        bone: '#EDEAE4',
                        red:  '#E10600'
                    },
                    fontFamily: {
                        display: ['"Saira Condensed"', 'sans-serif'],
                        sans:    ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="hero">

        <!-- ============ BACKGROUND VIDEO ============ -->
        <video class="hero__video" autoplay muted loop playsinline poster="images/hero-poster.jpg">
            <source src="images/hero.mp4" type="video/mp4">
        </video>
        <div class="hero__scrim" aria-hidden="true"></div>

        <!-- ============ NAV ============ -->
        <header class="nav">
            <button type="button" class="nav__menu" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
                <img class="nav__menu-icon" src="images/icon-menu.svg" alt="">
                <span>Menu</span>
            </button>

            <a class="nav__logo" href="/" aria-label="KERBECK — home">
                <img src="images/logo-kerbeck.svg" alt="KERBECK">
            </a>

            <a class="nav__contact" href="#contact">Contact</a>
        </header>

        <!-- ============ BOTTOM DOCK — collapsible hover sections ============ -->
        <section class="dock" aria-label="Our brands">

            <!-- Premium brands -->
            <div class="sect" data-sect="premium">
                <span class="sect__label">Our Premium Brands</span>
                <div class="sect__content">
                    <ul class="brands">
                        <li>
                            <a href="https://www.fckerbecklamborghini.com/" target="_blank" rel="noopener" aria-label="Lamborghini">
                                <img src="images/brand-lamborghini.svg" alt="Lamborghini">
                            </a>
                        </li>
                        <li>
                            <a href="https://www.fckerbeckrollsroyce.com/" target="_blank" rel="noopener" aria-label="Rolls-Royce">
                                <img src="images/brand-rolls-royce.svg" alt="Rolls-Royce">
                            </a>
                        </li>
                        <li>
                            <a href="https://www.astonmartinphiladelphia.com/" target="_blank" rel="noopener" aria-label="Aston Martin">
                                <img src="images/brand-aston-martin.svg" alt="Aston Martin">
                            </a>
                        </li>
                        <li>
                            <a href="https://www.fckerbeckmaserati.com/" target="_blank" rel="noopener" aria-label="Maserati">
                                <img src="images/brand-maserati.svg" alt="Maserati">
                            </a>
                        </li>
                        <li>
                            <a class="brands__bentley" href="https://www.bentleypalmyra.com/" target="_blank" rel="noopener" aria-label="Bentley">
                                <img src="images/brand-bentley-wings.svg" alt="">
                                <img src="images/brand-bentley-word.svg" alt="Bentley">
                            </a>
                        </li>
                    </ul>
                    <a class="btn-red sect__all" href="https://www.kerbeckcars.com/" target="_blank" rel="noopener">View All</a>
                </div>
            </div>

            <!-- Buick GMC -->
            <div class="sect" data-sect="gmc">
                <span class="sect__label">Buick GMC</span>
                <div class="sect__content">
                    <ul class="brands">
                        <li>
                            <a href="https://www.fckerbeckbuickgmc.com/" target="_blank" rel="noopener" aria-label="Buick">
                                <span class="wordmark">Buick</span>
                            </a>
                        </li>
                        <li>
                            <a href="https://www.fckerbeckbuickgmc.com/" target="_blank" rel="noopener" aria-label="GMC">
                                <span class="wordmark">GMC</span>
                            </a>
                        </li>
                    </ul>
                    <a class="btn-red sect__all" href="https://www.fckerbeckbuickgmc.com/" target="_blank" rel="noopener">View All</a>
                </div>
            </div>

            <!-- Preowned Cadillac -->
            <div class="sect" data-sect="cadillac">
                <span class="sect__label">Preowned Cadillac</span>
                <div class="sect__content">
                    <ul class="brands">
                        <li>
                            <a href="https://www.fckerbeckcadillacs.com/" target="_blank" rel="noopener" aria-label="Cadillac">
                                <img src="images/brand-cadillac.svg" alt="Cadillac">
                            </a>
                        </li>
                    </ul>
                    <a class="btn-red sect__all" href="https://www.fckerbeckcadillacs.com/" target="_blank" rel="noopener">View All</a>
                </div>
            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
